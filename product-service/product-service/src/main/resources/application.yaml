spring:
  application:
    name: product-service
  datasource:
    url: jdbc:postgresql://localhost:5432/product_service_db
    password: postgres
    username: postgres
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8082